name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,xlsx]"

      - name: Lint
        run: ruff check .

      - name: Test
        # The suite makes no network calls; every input is a literal.
        run: pytest -v --cov=creatorcontacts --cov-report=term-missing

  scope-guard:
    # The refusals in docs/SCOPE.md are enforced by code, so verify the
    # enforcement points still exist rather than trusting the docs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: People-search hosts must stay blocked
        run: pytest tests/test_links.py -v

      - name: Phone and address must stay business-source only
        run: |
          pytest tests/test_extract.py -v -k "phone or address"

      - name: No CAPTCHA-bypass or headless-browser dependency crept in
        run: |
          if grep -rniE '2captcha|anticaptcha|capmonster|deathbycaptcha|undetected.chromedriver|selenium|playwright|puppeteer' \
               --include='*.py' --include='*.toml' --include='*.txt' src/ pyproject.toml; then
            echo "::error::A CAPTCHA-solving or browser-automation dependency was added. See docs/SCOPE.md."
            exit 1
          fi
          echo "Clean."
